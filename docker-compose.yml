services:
  # Live dev server, hot-reloads as you edit files on Windows.
  # Run with: docker compose up dev
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    volumes:
      # Bind-mounts your project folder into the container, so edits you
      # make in VS Code / Notepad on Windows show up instantly (hot reload).
      - .:/app
      # Anonymous volume so the container's own node_modules (built for
      # Linux) isn't clobbered by the bind mount above.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # file-watching reliability on Windows bind mounts

  # Actual production build (astro build + astro preview) — matches what
  # you'd deploy. No live reload; re-run `docker compose up --build preview`
  # after changing source to see updates.
  # Run with: docker compose up preview
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    ports:
      - "4322:4321"
